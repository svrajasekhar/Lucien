<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lucien Apartments – Revenue & Expense Dashboard</title>

  <!-- Mobile critical -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .meta {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-bottom: 12px;
    }

    .toggle {
      text-align: center;
      margin-bottom: 12px;
    }

    select {
      padding: 6px 10px;
      font-size: 14px;
    }

    .chart {
      background: #fff;
      margin-bottom: 16px;
      padding: 8px;
      border-radius: 6px;
      min-height: 320px;
    }
  </style>
</head>

<body>

<h1>Lucien Apartments – Revenue & Expense Dashboard</h1>
<div class="meta" id="lastUpdated">Loading data…</div>

<div class="toggle">
  View:
  <select id="periodToggle">
    <option value="monthly">Monthly</option>
    <option value="quarterly">Quarterly</option>
  </select>
</div>

<div id="trendChart" class="chart"></div>
<div id="incomePie" class="chart"></div>
<div id="expensePie" class="chart"></div>

<script>
/* ================= CONFIG ================= */

const DATA_URL =
  "https://raw.githubusercontent.com/svrajasekhar/Lucien/main/Year2025Data.json";

const OPENING_BALANCE = 563124.60;

/* ================= HELPERS ================= */

function parseAmount(val) {
  if (!val) return 0;
  return parseFloat(val.replace(/₹|,/g, ""));
}

function getPeriodKey(date, mode) {
  const d = new Date(date);
  if (mode === "monthly") {
    return d.getFullYear() + "-" + (d.getMonth() + 1);
  }
  const q = Math.floor(d.getMonth() / 3) + 1;
  return d.getFullYear() + " Q" + q;
}

/* ================= DASHBOARD ================= */

async function loadDashboard() {
  const response = await fetch(DATA_URL);
  const data = await response.json();

  document.getElementById("lastUpdated").innerText =
    "Last updated from GitHub: " + new Date().toLocaleString();

  const mode = document.getElementById("periodToggle").value;

  const periodMap = {};
  const incomeCat = {};
  const expenseCat = {};

  let totalCredit = 0;
  let totalDebit = 0;

  data.forEach(row => {
    const date = row.Date.replace(/'/g, "");
    const period = getPeriodKey(date, mode);

    const credit = parseAmount(row.Credit);
    const debit = parseAmount(row.Debit);

    totalCredit += credit;
    totalDebit += debit;

    periodMap[period] = periodMap[period] || { income: 0, expense: 0 };
    periodMap[period].income += credit;
    periodMap[period].expense += debit;

    if (credit > 0) {
      incomeCat[row.Particulars] =
        (incomeCat[row.Particulars] || 0) + credit;
    }

    if (debit > 0) {
      expenseCat[row.Particulars] =
        (expenseCat[row.Particulars] || 0) + debit;
    }
  });

  /* -------- Trend Chart -------- */

  const periods = Object.keys(periodMap).sort();
  const incomeSeries = periods.map(p => periodMap[p].income);
  const expenseSeries = periods.map(p => periodMap[p].expense);

  Plotly.newPlot("trendChart", [
    { x: periods, y: incomeSeries, name: "Income", type: "bar" },
    { x: periods, y: expenseSeries, name: "Expense", type: "bar" }
  ], {
    title: "Income vs Expense (" + mode + ")",
    barmode: "group",
    responsive: true
  });

  /* -------- Income Pie -------- */

  Plotly.newPlot("incomePie", [{
    labels: Object.keys(incomeCat),
    values: Object.values(incomeCat),
    type: "pie"
  }], {
    title: "Income Category Breakdown",
    responsive: true
  });

  /* -------- Expense Pie (5% rule) -------- */

  const expenseTotal = Object.values(expenseCat).reduce((a,b)=>a+b,0);
  const mainLabels = [];
  const mainValues = [];
  let otherTotal = 0;

  Object.entries(expenseCat).forEach(([k,v]) => {
    if (v / expenseTotal < 0.05) {
      otherTotal += v;
    } else {
      mainLabels.push(k);
      mainValues.push(v);
    }
  });

  if (otherTotal > 0) {
    mainLabels.push("Other Expenses");
    mainValues.push(otherTotal);
  }

  Plotly.newPlot("expensePie", [{
    labels: mainLabels,
    values: mainValues,
    type: "pie"
  }], {
    title: "Expense Category Breakdown",
    responsive: true
  });
}

/* ================= EVENTS ================= */

document.getElementById("periodToggle").addEventListener("change", loadDashboard);
loadDashboard();
</script>

</body>
</html>
