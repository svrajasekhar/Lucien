
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lucien Apartments – Revenue & Expense Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<style>
:root{--bg:#f6f8fa;--card:#ffffff;--text:#222;--muted:#666}
body.dark{--bg:#0f172a;--card:#111827;--text:#e5e7eb;--muted:#9ca3af}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
margin:0;padding:0;background:var(--bg);color:var(--text)}

/* Letterhead */
.header{
  background:var(--card);
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.header img{
  width:100%;
  max-height:120px;
  object-fit:contain;
}

/* Page padding below header */
.container{padding:10px}

.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.toggle{cursor:pointer;font-size:13px;padding:6px 10px;border-radius:20px;background:var(--card)}
h1{text-align:center;font-size:18px;margin:0}
.kpi-container{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi,.card{background:var(--card);border-radius:10px;padding:10px;
box-shadow:0 2px 6px rgba(0,0,0,.15)}
.kpi h3{margin:0;font-size:12px;color:var(--muted)}
.kpi p{margin-top:4px;font-size:16px;font-weight:600}
.chart{height:260px}
@media (min-width:768px){
  .chart{height:340px}
  .kpi-container{grid-template-columns:repeat(4,1fr)}
  h1{font-size:20px}
  .header img{max-height:140px}
}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
th,td{padding:6px;border-bottom:1px solid #ccc;text-align:left}
.hidden{display:none}
.footer{text-align:center;font-size:11px;color:var(--muted);margin:10px 0}
</style>
</head>

<body>

<!-- Association Letterhead -->
<div class="header">
  <!-- Replace src with your GitHub Pages hosted letterhead image URL -->
  <img src="https://raw.githubusercontent.com/svrajasekhar/Lucien/main/letterhead_header.png" alt="Lucien Apartments Letterhead">
</div>

<div class="container">

<div class="top-bar">
  <h1>Revenue & Expense Dashboard</h1>
  <div class="toggle" onclick="toggleDark()">🌙</div>
</div>

<div class="kpi-container">
  <div class="kpi"><h3>Opening Balance</h3><p id="ob"></p></div>
  <div class="kpi"><h3>Total Credit</h3><p id="tc"></p></div>
  <div class="kpi"><h3>Total Debit</h3><p id="td"></p></div>
  <div class="kpi"><h3>Closing Balance</h3><p id="cb"></p></div>
</div>

<div class="card">
  <h3>Revenue</h3>
  <div id="revPie" class="chart"></div>
  <div id="revOthers" class="hidden"></div>
</div>

<div class="card">
  <h3>Expense</h3>
  <div id="expPie" class="chart"></div>
  <div id="expOthers" class="hidden"></div>
</div>

<div class="footer">
  Last updated from GitHub: <span id="lu"></span>
</div>

</div>

<script>
const DATA_URL="https://raw.githubusercontent.com/svrajasekhar/Lucien/main/Year2025Data.json";
const OB=563124.60;

function inr(n){return "₹"+n.toLocaleString("en-IN",{minimumFractionDigits:2})}
function toggleDark(){document.body.classList.toggle("dark");
localStorage.setItem("dm",document.body.classList.contains("dark"))}
if(localStorage.getItem("dm")==="true")document.body.classList.add("dark");

fetch(DATA_URL).then(r=>r.json()).then(data=>{
  document.getElementById("lu").textContent=new Date().toLocaleString();
  let tc=0,td=0,rev={},exp={};
  data.forEach(t=>{
    let c=parseFloat((t.Credit||"0").replace(/[₹,]/g,""))||0;
    let d=parseFloat((t.Debit||"0").replace(/[₹,]/g,""))||0;
    if(c){tc+=c;rev[t.Particulars]=(rev[t.Particulars]||0)+c}
    if(d){td+=d;exp[t.Particulars]=(exp[t.Particulars]||0)+d}
  });

  document.getElementById("ob").textContent=inr(OB);
  document.getElementById("tc").textContent=inr(tc);
  document.getElementById("td").textContent=inr(td);
  document.getElementById("cb").textContent=inr(OB+tc-td);

  function pie(map,div,otherDiv,label){
    const tot=Object.values(map).reduce((a,b)=>a+b,0);
    let l=[],v=[],o=[],ot=0;
    Object.entries(map).forEach(([k,val])=>{
      if(val/tot<0.05){o.push([k,val]);ot+=val}
      else{l.push(k);v.push(val)}
    });
    if(ot){l.push("Others");v.push(ot)}
    Plotly.newPlot(div,[{labels:l,values:v,type:"pie",hole:.45}],
      {margin:{t:10,b:10,l:10,r:10},paper_bgcolor:"transparent"},
      {responsive:true});
    if(o.length){
      otherDiv.innerHTML="<b>"+label+" – Others</b><table>"+
        o.map(x=>`<tr><td>${x[0]}</td><td>${inr(x[1])}</td></tr>`).join("")+"</table>";
      document.getElementById(div).on('plotly_click',d=>{
        if(d.points[0].label==="Others")otherDiv.classList.toggle("hidden");
      });
    }
  }

  pie(rev,"revPie",document.getElementById("revOthers"),"Revenue");
  pie(exp,"expPie",document.getElementById("expOthers"),"Expense");
});
</script>
</body>
</html>
